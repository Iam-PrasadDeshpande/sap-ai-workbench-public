name: KS05 R3A isolated qualification
on:
  push:
    branches:
      - qualification/ks05-r3a-20261027
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact approved release candidate
        uses: actions/checkout@v4
        with:
          ref: e2d52c9acef2531791efaea779ad6f71b0530548
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Git candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e2d52c9acef2531791efaea779ad6f71b0530548"
          git status --short
      - name: Run eight public-release regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p test_public_release.py -v
      - name: Run public-site qualification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/qualify_public_release.py --source-commit 5e858925a485a62fca19bb3c265068765a0b14c2
      - name: Confirm manifest rebuild is reproducible
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python -B scripts/build_public_manifest.py --source-commit 5e858925a485a62fca19bb3c265068765a0b14c2
          git diff --exit-code -- PUBLIC_MANIFEST.json
